[workspace]
members = [".", "crates/ccc-claude-auth", "crates/ccc-claude-code-hook", "crates/ccc-archive", "crates/ccc-sessions", "crates/ccc-sshkit", "crates/ccc-ssh"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[package]
name = "ccc"
version = "0.10.2"
description = "Claude Code Conductor"
authors = ["Hiroyuki Tanaka"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ccc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
anyhow = { workspace = true }
fontdb = "0"
axum = "0.7"
rand = "0.8"
ccc-archive = { path = "crates/ccc-archive" }
ccc-sshkit = { path = "crates/ccc-sshkit" }
vt100 = "0.16.2"
libc = "0.2"
