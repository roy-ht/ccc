[package]
name = "ccc-ssh"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "ssh ラッパー CLI: port forward 台帳管理と gpg agent forward（relay 方式）を仕込んだ ssh"

[[bin]]
name = "ccc-ssh"
path = "src/main.rs"

[dependencies]
ccc-sshkit = { path = "../ccc-sshkit" }
ccc-gpg-relay = { path = "../ccc-gpg-relay" }
anyhow = { workspace = true }
libc = "0.2"
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
